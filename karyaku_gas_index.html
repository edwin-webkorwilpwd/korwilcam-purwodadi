<!DOCTYPE html>
<html lang="id" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>E-Reader Digital Purwodadi - Aplikasi Pembaca Buku</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>
    <!-- PageFlip 3D Library -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            900: '#0c4a6e',
                        },
                        reader: {
                            paper: '#fbf9f5',
                            dark: '#1a1a1a',
                            sepia: '#f4ebd0',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
        }

        html, body {
            min-height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            -webkit-overflow-scrolling: touch;
        }

        body {
            padding-top: var(--sat);
            padding-bottom: var(--sab);
            padding-left: var(--sal);
            padding-right: var(--sar);
            box-sizing: border-box;
        }

        * {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
        *::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        *, *::before, *::after {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #hero-slideshow-bg,
        #popup-modal,
        #loading-modal,
        #flipbook-wrapper {
            will-change: opacity, transform;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        .book-card {
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .book-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 15px 20px -5px rgba(0, 0, 0, 0.08);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #flipbook-wrapper {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            background: #1e293b;
            max-width: 100%;
        }
        .flipbook-page {
            background-color: #ffffff;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .flipbook-page canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-full flex flex-col">

    <div id="app" class="flex-1 flex flex-col w-full min-h-full">
        <!-- Rendered dynamically by JavaScript -->
    </div>

    <!-- Centered Image Popup Modal -->
    <div id="popup-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300 pb-[calc(1rem+env(safe-area-inset-bottom))]">
        <div id="popup-card" class="relative max-w-lg w-full bg-white rounded-3xl overflow-hidden shadow-2xl border border-white/20 transform scale-95 transition-all duration-300 flex flex-col items-center">
            <button onclick="closePopupModal()" class="absolute top-3 right-3 z-10 w-9 h-9 bg-slate-900/70 hover:bg-slate-900 text-white rounded-full flex items-center justify-center transition shadow-lg">
                <i class="fas fa-times text-sm"></i>
            </button>
            <div id="popup-image-container" class="w-full bg-slate-100 flex items-center justify-center overflow-hidden min-h-[250px] max-h-[70vh]">
                <img id="popup-image" src="" alt="Popup" class="w-full h-full object-contain max-h-[70vh]">
            </div>
            <div id="popup-title-bar" class="w-full p-4 bg-white text-center border-t border-slate-100 hidden">
                <h3 id="popup-title-text" class="text-sm font-bold text-slate-800"></h3>
            </div>
        </div>
    </div>

    <!-- Process Loading Popup Modal -->
    <div id="loading-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300 pb-[calc(1rem+env(safe-area-inset-bottom))]">
        <div id="loading-modal-card" class="bg-white/95 backdrop-blur-xl p-7 rounded-3xl shadow-2xl border border-white/40 flex flex-col items-center justify-center max-w-xs w-full mx-4 transform scale-95 transition-all duration-300">
            <div class="relative w-16 h-16 flex items-center justify-center mb-4">
                <div class="absolute inset-0 rounded-full border-4 border-brand-500/20 animate-ping"></div>
                <div class="w-14 h-14 border-4 border-brand-500/20 border-t-brand-600 rounded-full animate-spin"></div>
                <i class="fas fa-shield-alt text-brand-600 text-lg absolute"></i>
            </div>
            <h4 id="loading-modal-text" class="text-sm font-bold text-slate-800 text-center">Memproses...</h4>
            <p class="text-[11px] text-slate-400 mt-1 text-center font-medium">Mohon tunggu sebentar</p>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none max-w-[90vw] mb-[env(safe-area-inset-bottom,0px)]">
        <div id="toast-content" class="bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-slate-700">
            <i id="toast-icon" class="fas fa-check-circle text-emerald-400 text-lg"></i>
            <span id="toast-message" class="text-sm font-medium">Notifikasi</span>
        </div>
    </div>

    <!-- Initial Data Scriptlet Container -->
    <script id="initial-books-data" type="application/json"><?!= initialBooksData ?></script>

    <script>
        var initialBooksData = [];
        try {
            var dataEl = document.getElementById('initial-books-data');
            if (dataEl && dataEl.textContent.trim()) {
                initialBooksData = JSON.parse(dataEl.textContent);
            }
        } catch(e) {
            initialBooksData = [];
        }

        const CATEGORIES = ["Semua", "Novel & Cerpen", "Komik", "Dongeng & Fabel", "Biografi & Autobiografi", "Pengembangan Diri", "Agama & Spiritual", "Buku Teks/Pelajaran", "Buku Ajar & Monograf"];

        let state = {
            currentUser: null, 
            currentView: 'catalog',
            authTab: 'login',
            profileTab: 'pribadi',
            allBooks: Array.isArray(initialBooksData) ? initialBooksData : [],        
            books: Array.isArray(initialBooksData) ? initialBooksData : [],           
            selectedBook: null,
            selectedAuthor: null,
            selectedAuthorBook: null,
            authorsCache: {},
            currentPageNum: 1,
            totalPagesNum: 1,
            searchQuery: '',
            selectedCategory: 'Semua',
            bookmarks: [],
            isLoading: false,
            pageFlipInstance: null,
            isPdfLoading: false,
            pdfLoadProgress: '0%',
            pdfCache: {},          
            canvasCache: {},        
            popups: [],
            hasShownHomePopup: false,
            hasShownLastPagePopup: false,
            selectedRating: 5,
            zoomScale: 100,
            bannerImages: [],
            currentBannerIndex: 0,
            bannerTimer: null,
            hasIncrementedReadCount: false,
            pendingNav: null
        };

        // ==============================================================
        // ==============================================================
        // SINKRONISASI DUA ARAH KE WEBSITE UTAMA KORWILCAM (postMessage & URL)
        // ==============================================================
        function notifyParentKaryaku(payload) {
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(payload, '*');
                }
                if (window.top && window.top !== window) {
                    window.top.postMessage(payload, '*');
                }
            } catch (e) {}
        }

        // Fungsi mengeksekusi navigasi buku / penulis secara cerdas & adaptif
        function processKaryakuNav(data) {
            if (!data || typeof data !== 'object') return;

            // 1. Navigasi ke Halaman Profil Penulis
            if (data.type === 'KARYAKU_OPEN_AUTHOR' && data.username) {
                const targetUser = String(data.username).toLowerCase().trim();
                const matched = (state.allBooks || []).find(b => {
                    const u = String(b.uploadedBy || '').toLowerCase().trim();
                    const a = String(b.author || '').toLowerCase().replace(/[\s_-]+/g, '-').trim();
                    return u === targetUser || a === targetUser;
                });

                if (matched) {
                    openAuthorView(matched.id);
                    state.pendingNav = null;
                } else if (!state.allBooks || state.allBooks.length === 0) {
                    state.pendingNav = data;
                }
            } 
            // 2. Navigasi ke Pembaca Flipbook Buku (Reader)
            else if (data.type === 'KARYAKU_OPEN_READER' && (data.bookTitle || data.username)) {
                const rawTitle = String(data.bookTitle || '').toLowerCase().trim();
                const targetSlug = rawTitle.replace(/[^\w\s-]/g, '').replace(/[\s_-]+/g, '-').trim();
                const targetAuthor = String(data.username || '').toLowerCase().trim();

                const matched = (state.allBooks || []).find(b => {
                    const bSlug = String(b.title || '').toLowerCase().replace(/[^\w\s-]/g, '').replace(/[\s_-]+/g, '-').trim();
                    const bTitleLower = String(b.title || '').toLowerCase().trim();
                    
                    const titleMatches = (targetSlug && (bSlug === targetSlug || bTitleLower === rawTitle || bSlug.includes(targetSlug) || targetSlug.includes(bSlug)));
                    
                    if (titleMatches) return true;

                    // Fallback jika hanya nama penulis yang cocok dan judul tidak diberikan
                    if (!targetSlug && targetAuthor && targetAuthor !== 'admin' && targetAuthor !== 'penulis') {
                        const bUser = String(b.uploadedBy || '').toLowerCase().trim();
                        return bUser === targetAuthor;
                    }
                    return false;
                });

                if (matched) {
                    openBookReader(matched.id);
                    state.pendingNav = null;
                } else if (!state.allBooks || state.allBooks.length === 0) {
                    state.pendingNav = data;
                }
            } 
            // 3. Kembali ke Beranda Katalog
            else if (data.type === 'KARYAKU_OPEN_CATALOG') {
                state.pendingNav = null;
                if (state.currentView !== 'catalog') switchView('catalog');
            }
        }

        // Menerima perintah navigasi langsung dari website utama melalui postMessage
        window.addEventListener('message', function(event) {
            if (!event.data || typeof event.data !== 'object') return;
            processKaryakuNav(event.data);
        });

        // Memeriksa parameter URL bawaan Google Apps Script / Blogger saat halaman dimuat
        function checkUrlParametersOnLoad() {
            // Jalur A: API Resmi google.script.url.getLocation (Google Apps Script)
            if (typeof google !== 'undefined' && google.script && google.script.url && google.script.url.getLocation) {
                try {
                    google.script.url.getLocation(function(loc) {
                        if (loc && loc.parameters) {
                            const p = loc.parameters;
                            const book = (p.book && p.book[0]) || (p.judul && p.judul[0]);
                            const user = (p.user && p.user[0]) || (p.author && p.author[0]) || (p.penulis && p.penulis[0]);
                            const view = (p.view && p.view[0]);

                            if (book || (view === 'reader' && (book || user))) {
                                processKaryakuNav({
                                    type: 'KARYAKU_OPEN_READER',
                                    bookTitle: book,
                                    username: user
                                });
                            } else if (user || view === 'author') {
                                processKaryakuNav({
                                    type: 'KARYAKU_OPEN_AUTHOR',
                                    username: user
                                });
                            }
                        }
                    });
                } catch(e) {}
            }

            // Jalur B: window.location.search & hash (jika diteruskan langsung via iframe src)
            try {
                const search = window.location.search || '';
                const hash = window.location.hash || '';
                const queryStr = search ? search.substring(1) : (hash.includes('?') ? hash.split('?')[1] : (hash.startsWith('#') ? hash.substring(1) : ''));
                if (queryStr) {
                    const params = new URLSearchParams(queryStr);
                    const book = params.get('book') || params.get('judul');
                    const user = params.get('user') || params.get('author') || params.get('penulis');
                    const view = params.get('view');

                    if (book || (view === 'reader' && (book || user))) {
                        processKaryakuNav({
                            type: 'KARYAKU_OPEN_READER',
                            bookTitle: book,
                            username: user
                        });
                    } else if (user || view === 'author') {
                        processKaryakuNav({
                            type: 'KARYAKU_OPEN_AUTHOR',
                            username: user
                        });
                    }
                }
            } catch(e) {}
        }
        // ==============================================================

        function parseAvatarUrl(url) {
            if (!url) return '';
            var str = String(url).trim();
            if (str.indexOf('drive.google.com') !== -1 || str.indexOf('docs.google.com') !== -1) {
                var match = str.match(/\/d\/([a-zA-Z0-9_-]+)/) || str.match(/id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    return 'https://lh3.googleusercontent.com/d/' + match[1];
                }
            }
            return str;
        }

        function getAvatarOnErrorAttr(rawUrl, defaultName) {
            var match = String(rawUrl || '').match(/\/d\/([a-zA-Z0-9_-]+)/) || String(rawUrl || '').match(/id=([a-zA-Z0-9_-]+)/);
            var fallbackAvatar = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(defaultName || 'User') + '&background=0284c7&color=fff';
            
            if (match && match[1]) {
                return `onerror="if(!this.dataset.retried){this.dataset.retried='1';this.src='https://drive.google.com/thumbnail?id=${match[1]}&sz=w500';}else{this.src='${fallbackAvatar}';}"`;
            }
            return `onerror="this.src='${fallbackAvatar}'"`;
        }

        function restorePopupCardHtml() {
            const card = document.getElementById('popup-card');
            if (!card) return;
            card.innerHTML = `
                <button onclick="closePopupModal()" class="absolute top-3 right-3 z-10 w-9 h-9 bg-slate-900/70 hover:bg-slate-900 text-white rounded-full flex items-center justify-center transition shadow-lg">
                    <i class="fas fa-times text-sm"></i>
                </button>
                <div id="popup-image-container" class="w-full bg-slate-100 flex items-center justify-center overflow-hidden min-h-[250px] max-h-[70vh]">
                    <img id="popup-image" src="" alt="Popup" class="w-full h-full object-contain max-h-[70vh]">
                </div>
                <div id="popup-title-bar" class="w-full p-4 bg-white text-center border-t border-slate-100 hidden">
                    <h3 id="popup-title-text" class="text-sm font-bold text-slate-800"></h3>
                </div>
            `;
        }

        function showGuestLimitPopup() {
            const modal = document.getElementById('popup-modal');
            const card = document.getElementById('popup-card');
            
            if (!modal || !card) return;

            card.innerHTML = `
                <div class="p-6 sm:p-8 text-center flex flex-col items-center">
                    <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center text-2xl font-bold mb-4 shadow-md">
                        <i class="fas fa-lock"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-900 mb-2">Batas Membaca Gratis Telah Dicapai</h3>
                    <p class="text-xs sm:text-sm text-slate-500 mb-6 leading-relaxed max-w-sm">
                        Akses membaca pengunjung dibatasi hingga <strong class="text-slate-800">halaman 6</strong> untuk melindungi karya cipta penulis. Silakan <strong class="text-brand-600">Login</strong> atau <strong class="text-brand-600">Daftar Akun</strong> secara gratis untuk melanjutkan membaca.
                    </p>
                    <div class="flex flex-col sm:flex-row gap-3 w-full">
                        <button onclick="closePopupModal(); switchView('auth'); switchAuthTab('login');" class="flex-1 py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs sm:text-sm rounded-xl shadow-lg shadow-brand-500/20 transition flex items-center justify-center gap-2">
                            <i class="fas fa-sign-in-alt"></i> Login Sekarang
                        </button>
                        <button onclick="closePopupModal(); switchView('auth'); switchAuthTab('register');" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs sm:text-sm rounded-xl shadow-lg shadow-emerald-500/20 transition flex items-center justify-center gap-2">
                            <i class="fas fa-user-plus"></i> Daftar Akun
                        </button>
                    </div>
                </div>
            `;

            window.popupOnClosed = null;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
        }

        function showLastPagePopup() {
            const modal = document.getElementById('popup-modal');
            const card = document.getElementById('popup-card');
            
            if (!modal || !card) return;

            card.innerHTML = `
                <div class="p-6 sm:p-8 text-center flex flex-col items-center">
                    <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl font-bold mb-4 shadow-md">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-900 mb-2">Selesai Membaca</h3>
                    <p class="text-xs sm:text-sm text-slate-600 mb-6 leading-relaxed max-w-sm">
                        Anda telah membaca buku ini hingga halaman terakhir
                    </p>
                    <button onclick="closePopupModal(); switchView('review');" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs sm:text-sm rounded-xl shadow-lg shadow-brand-500/20 transition flex items-center justify-center gap-2">
                        <i class="fas fa-star"></i> Selesai
                    </button>
                </div>
            `;

            window.popupOnClosed = null;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
        }

        function callServer(functionName, args, onSuccess, onError, isSilent) {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                var runner = google.script.run
                    .withSuccessHandler(function(res) {
                        if (!isSilent) showLoading(false);
                        if (onSuccess) onSuccess(res);
                    })
                    .withFailureHandler(function(err) {
                        if (!isSilent) showLoading(false);
                        if (!isSilent) showToast(err.message || "Gagal terhubung ke server", 'error');
                        if (onError) onError(err);
                    });
                
                if (args && args.length > 0) {
                    runner[functionName].apply(runner, args);
                } else {
                    runner[functionName]();
                }
            } else {
                setTimeout(function() {
                    if (!isSilent) showLoading(false);
                    if (onSuccess) onSuccess({ success: true, data: [] });
                }, 400);
            }
        }

        function render() {
            const app = document.getElementById('app');
            
            switch (state.currentView) {
                case 'auth':
                    app.innerHTML = renderAuthView();
                    break;
                case 'catalog':
                    app.innerHTML = renderCatalogView();
                    initBannerSlideshow();
                    break;
                case 'reader':
                    app.innerHTML = renderReaderView();
                    initFlipbookReader();
                    break;
                case 'upload':
                    app.innerHTML = renderUploadView();
                    break;
                case 'profile':
                    app.innerHTML = renderProfileView();
                    break;
                case 'author':
                    app.innerHTML = renderAuthorView();
                    break;
                case 'author_books':
                    app.innerHTML = renderAuthorBooksView();
                    break;
                case 'review':
                    app.innerHTML = renderReviewView();
                    break;
                default:
                    app.innerHTML = renderCatalogView();
                    initBannerSlideshow();
            }
        }

        function switchAuthTab(tab) {
            state.authTab = tab;
            render();
        }

        function switchProfileTab(tab) {
            state.profileTab = tab;
            render();
        }

        function switchView(viewName) {
            state.currentView = viewName;
            // Sinkronkan ke URL /karyaku ketika kembali ke katalog
            if (viewName === 'catalog') {
                notifyParentKaryaku({
                    type: 'KARYAKU_NAVIGATE',
                    view: 'catalog'
                });
            }
            render();
        }

        function renderPopularBooks() {
            if (!state.allBooks || state.allBooks.length === 0) return '';

            const topBooks = [...state.allBooks]
                .sort((a, b) => (Number(b.readCount) || 0) - (Number(a.readCount) || 0))
                .slice(0, 5);

            if (topBooks.length === 0) return '';

            return `
                <div class="flex items-center justify-between mb-3 sm:mb-4">
                    <div class="flex items-center space-x-2">
                        <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center font-bold text-xs sm:text-sm">
                            <i class="fas fa-fire"></i>
                        </div>
                        <h3 class="text-sm sm:text-base font-bold text-slate-900">Buku Populer</h3>
                    </div>
                    <span class="text-[11px] text-slate-400 font-medium">Top 5 Dibaca</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 xl:grid-cols-5 2xl:grid-cols-5 gap-4 sm:gap-6">
                    ${topBooks.map(book => renderBookCard(book)).join('')}
                </div>
            `;
        }

        function renderEmptyState() {
            return `
                <div class="text-center py-16 bg-white rounded-3xl border border-dashed border-slate-300 p-8 max-w-md mx-auto my-8">
                    <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                        <i class="fas fa-search-minus"></i>
                    </div>
                    <h3 class="text-base font-bold text-slate-800 mb-1">Buku Tidak Ditemukan</h3>
                    <p class="text-xs text-slate-500 mb-4">Tidak ada koleksi buku yang cocok dengan pencarian Anda.</p>

        function renderBookCard(book, directToReader = false) {
            const isBookmarked = state.bookmarks.includes(book.id);
            
            let coverUrl = book.cover || '';
            let driveId = '';

            if (coverUrl && (coverUrl.includes('drive.google.com') || coverUrl.includes('docs.google.com'))) {
                const match = coverUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || coverUrl.match(/id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    driveId = match[1];
                    coverUrl = 'https://lh3.googleusercontent.com/d/' + driveId;
                }
            }

            const onerrorAttr = driveId 
                ? `onerror="if(!this.dataset.retried){this.dataset.retried=1; this.src='https://drive.google.com/thumbnail?id=${driveId}&sz=w800';}else{this.src='https://placehold.co/400x600/e2e8f0/64748b?text=No+Cover';}"`
                : `onerror="this.src='https://placehold.co/400x600/e2e8f0/64748b?text=No+Cover'"`;

            const clickHandler = directToReader ? `openBookReader('${book.id}')` : `openAuthorView('${book.id}')`;

            return `

                            <span class="absolute top-3 left-3 px-2.5 py-1 bg-slate-900/80 backdrop-blur-md text-white text-[10px] font-bold rounded-lg tracking-wide uppercase shadow-sm">

                            </button>
                            ` : ''}
                        </div>

                        <div class="p-4 cursor-pointer" onclick="${clickHandler}">
                            <div class="flex items-center space-x-1 text-amber-400 text-xs mb-1">
                                <i class="fas fa-star"></i>
                                <span class="font-bold text-slate-700 text-xs ml-1">${book.rating || '5.0'}</span>
                                <span class="text-slate-400 text-[11px]">(${book.readCount || 0}x dibaca)</span>
                            </div>

                            <p class="text-xs text-slate-500 mb-2 font-medium"><i class="fas fa-pen-nib text-[10px] mr-1"></i> ${book.author}</p>

        function handleSubmitReview(e) {
            e.preventDefault();
            if (!state.selectedBook) return;

            const username = state.currentUser ? state.currentUser.username : 'Guest';
            const name = state.currentUser ? state.currentUser.name : 'Pengunjung';
            const rating = state.selectedRating || 5;
            const feedback = document.getElementById('rev-feedback').value.trim();
            const bookTitle = state.selectedBook.title;

            showLoading(true, 'Mengirim Penilaian & Testimoni...');

            callServer('serverSubmitReview', [username, name, rating, feedback, bookTitle], function(res) {
                showLoading(false);
                if (res.success) {
                    showToast(res.message || "Terima kasih atas penilaian dan testimoni Anda!");
                    
                    if (!state.selectedBook.reviews) state.selectedBook.reviews = [];
                    state.selectedBook.reviews.unshift({
                        username: username,
                        rating: rating,
                        feedback: feedback
                    });

                    fetchBooks();
                    switchView('catalog');
                } else {
                    showToast(res.message || "Gagal mengirim penilaian", "error");
                }
            }, function() {
                showLoading(false);
            });
        }

        function initFlipbookReader() {
            const book = state.selectedBook;
            if (!book || !book.cleanFileId) {
                const overlay = document.getElementById('pdf-loading-overlay');
                if (overlay) {
                    overlay.innerHTML = `
                        <div class="text-center p-6">
                            <i class="fas fa-exclamation-triangle text-amber-400 text-4xl mb-3"></i>
                            <h3 class="text-base font-bold">File PDF Tidak Ditemukan</h3>

                            <button onclick="switchView('catalog')" class="mt-4 px-4 py-2 bg-slate-800 text-white rounded-xl text-xs font-semibold">Kembali ke Katalog</button>
                        </div>
                    `;
                }
                return;
            }

            if (state.pdfCache[book.cleanFileId]) {
                const progressText = document.getElementById('pdf-progress-text');
                if (progressText) progressText.textContent = "Mengambil dari memori kilat...";
                renderPdfToFlipbook(state.pdfCache[book.cleanFileId]);
                return;
            }

            callServer('serverGetBookPdfData', [book.cleanFileId], function(res) {
                if (res.success && res.base64) {
                    state.pdfCache[book.cleanFileId] = res.base64;
                    renderPdfToFlipbook(res.base64);
                } else {
                    const overlay = document.getElementById('pdf-loading-overlay');
                    if (overlay) {
                        overlay.innerHTML = `
                            <div class="text-center p-6">
                                <i class="fas fa-exclamation-circle text-rose-500 text-4xl mb-3"></i>
                                <h3 class="text-base font-bold">Gagal Memuat PDF</h3>
                                <p class="text-xs text-slate-400 mt-1">${res.message || 'File PDF tidak dapat dibaca dari Google Drive.'}</p>
                                <button onclick="switchView('catalog')" class="mt-4 px-4 py-2 bg-slate-800 text-white rounded-xl text-xs font-semibold">Kembali ke Katalog</button>
                            </div>
                        `;
                    }
                }
            });
        }

        async function renderPdfToFlipbook(base64Data) {
            try {
                const progressText = document.getElementById('pdf-progress-text');
                if (progressText) progressText.textContent = "Mengurai halaman PDF...";

                const binaryString = atob(base64Data);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                const loadingTask = pdfjsLib.getDocument({ data: bytes });
                const pdf = await loadingTask.promise;
                
                state.totalPagesNum = pdf.numPages;
                const tpDisplay = document.getElementById('total-pages-display');
                if (tpDisplay) tpDisplay.textContent = pdf.numPages;

                const wrapper = document.getElementById('flipbook-wrapper');
                if (!wrapper) return;

                if (state.pageFlipInstance) {
                    try { state.pageFlipInstance.destroy(); } catch(e){}
                    state.pageFlipInstance = null;
                }

                wrapper.innerHTML = '';

                const firstPage = await pdf.getPage(1);
                const viewport = firstPage.getViewport({ scale: 1.0 });
                
                const isMobile = window.innerWidth < 640;
                const maxContainerWidth = isMobile ? (window.innerWidth - 16) : Math.min(window.innerWidth - 48, 1200);
                const maxContainerHeight = isMobile ? Math.max(window.innerHeight - 120, 480) : Math.min(window.innerHeight - 130, 800);

                const targetSinglePageWidth = isMobile ? maxContainerWidth : maxContainerWidth / 2;
                const scaleW = targetSinglePageWidth / viewport.width;
                const scaleH = maxContainerHeight / viewport.height;
                const pageScale = Math.min(scaleW, scaleH);

                const pageWidth = Math.max(140, Math.floor(viewport.width * pageScale));
                const pageHeight = Math.max(200, Math.floor(viewport.height * pageScale));

                const pagesArray = []; 
                const deviceRatio = window.devicePixelRatio || 1;
                const renderRatio = isMobile ? Math.min(deviceRatio, 1.25) : Math.min(deviceRatio, 1.75);

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    if (progressText) progressText.textContent = `Mengarsir halaman ${pageNum} dari ${pdf.numPages}...`;
                    
                    await new Promise(resolve => requestAnimationFrame(resolve));

                    const page = await pdf.getPage(pageNum);
                    const highResViewport = page.getViewport({ scale: pageScale * renderRatio });

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'flipbook-page';
                    pageDiv.style.width = `${pageWidth}px`;
                    pageDiv.style.height = `${pageHeight}px`;

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d', { alpha: false });
                    canvas.width = highResViewport.width;
                    canvas.height = highResViewport.height;
                    canvas.style.width = `${pageWidth}px`;
                    canvas.style.height = `${pageHeight}px`;

                    await page.render({
                        canvasContext: context,
                        viewport: highResViewport
                    }).promise;

                    pageDiv.appendChild(canvas);
                    wrapper.appendChild(pageDiv);
                    pagesArray.push(pageDiv);
                }

                if (pagesArray.length % 2 !== 0) {
                    const blankPageDiv = document.createElement('div');
                    blankPageDiv.className = 'flipbook-page';
                    blankPageDiv.style.width = `${pageWidth}px`;
                    blankPageDiv.style.height = `${pageHeight}px`;
                    wrapper.appendChild(blankPageDiv);
                    pagesArray.push(blankPageDiv);
                }

                if (typeof St !== 'undefined' && St.PageFlip) {
                    const pageFlip = new St.PageFlip(wrapper, {
                        width: pageWidth,
                        height: pageHeight,
                        size: 'fixed',
                        showCover: false,
                        usePortrait: isMobile,
                        mobileScrollSupport: true
                    });

                    pageFlip.loadFromHTML(pagesArray);
                    state.pageFlipInstance = pageFlip;

                    pageFlip.on('flip', (e) => {
                        state.currentPageNum = e.data + 1;
                        const pageDisplay = document.getElementById('current-page-display');
                        if (pageDisplay) pageDisplay.textContent = state.currentPageNum;

                        // Penguncian Akses Pengunjung (Max Halaman 6)
                        if (!state.currentUser && state.currentPageNum >= 6) {
                            if (state.currentPageNum > 6) {
                                state.pageFlipInstance.flip(5);
                                state.currentPageNum = 6;
                                if (pageDisplay) pageDisplay.textContent = 6;
                            }
                            showGuestLimitPopup();
                        }

                        // Deteksi Selesai Membaca Halaman Terakhir
                        if (state.currentPageNum >= state.totalPagesNum && !state.hasShownLastPagePopup) {
                            state.hasShownLastPagePopup = true;
                            showLastPagePopup();
                        }

                        if (state.currentPageNum >= 5 && !state.hasIncrementedReadCount && state.selectedBook) {
                            state.hasIncrementedReadCount = true;
                            callServer('serverIncrementReadCount', [state.selectedBook.id], function(res) {
                                if (res.success) state.selectedBook.readCount = res.readCount;
                            });
                        }
                    });
                }

                const overlay = document.getElementById('pdf-loading-overlay');
                if (overlay) overlay.style.display = 'none';

            } catch (err) {
                console.error(err);
                showToast("Gagal mengkonversi PDF ke Flipbook", 'error');
            }
        }

        function openBookReader(bookId) {
            const book = state.allBooks.find(b => String(b.id) === String(bookId)) || state.books.find(b => String(b.id) === String(bookId));
            if (book) {
                state.selectedBook = book;
                state.currentPageNum = 1;
                state.zoomScale = 100;
                state.hasIncrementedReadCount = false;
                state.hasShownLastPagePopup = false;
                state.selectedRating = 5;
                state.currentView = 'reader';

                // ==============================================================
                // KIRIM NOTIFIKASI SLUG KE WEBSITE UTAMA: /karyaku/:username/:judulBuku
                // ==============================================================
                notifyParentKaryaku({
                    type: 'KARYAKU_NAVIGATE',
                    view: 'reader',
                    username: book.uploadedBy || 'admin',
                    bookTitle: book.title || ''
                });

                render();
            }
        }

        function flipNext() {
            if (state.pageFlipInstance) {
                if (!state.currentUser && state.currentPageNum >= 6) {
                    showGuestLimitPopup();
                    return;
                }
                state.pageFlipInstance.flipNext();
            }
        }

        function flipPrev() {
            if (state.pageFlipInstance) {
                state.pageFlipInstance.flipPrev();
            }
        }

        function zoomIn() {
            if (!state.zoomScale) state.zoomScale = 100;
            if (state.zoomScale < 250) {
                state.zoomScale += 25;
                applyZoom();
            }
        }

        function zoomOut() {
            if (!state.zoomScale) state.zoomScale = 100;
            if (state.zoomScale > 50) {
                state.zoomScale -= 25;
                applyZoom();
            }
        }

        function zoomReset() {
            state.zoomScale = 100;
            applyZoom();
        }

        function applyZoom() {
            const wrapper = document.getElementById('flipbook-wrapper');
            const display = document.getElementById('zoom-percentage-display');
            const viewport = document.getElementById('flipbook-viewport');
            
            if (wrapper) {
                wrapper.style.transform = `scale(${state.zoomScale / 100})`;
                wrapper.style.transition = 'transform 0.2s ease';
                if (state.zoomScale > 100) {
                    wrapper.style.transformOrigin = 'center top';
                    wrapper.style.marginTop = '20px';
                    wrapper.style.marginBottom = '20px';
                } else {
                    wrapper.style.transformOrigin = 'center center';
                    wrapper.style.marginTop = '0px';
                    wrapper.style.marginBottom = '0px';
                }
            }
            if (display) {
                display.textContent = `${state.zoomScale}%`;
            }
            if (viewport) {
                if (state.zoomScale > 100) {
                    viewport.style.overflow = 'auto';
                    viewport.style.alignItems = 'flex-start';
                } else {
                    viewport.style.overflow = 'hidden';
                    viewport.style.alignItems = 'center';
                }
            }
        }

        function prefetchAuthorProfiles() {
            if (!state.allBooks || state.allBooks.length === 0) return;
            const usernames = [...new Set(state.allBooks.map(b => b.uploadedBy || 'admin').filter(Boolean))];
            usernames.forEach(username => {
                if (!state.authorsCache[username]) {
                    if (state.currentUser && String(state.currentUser.username).toLowerCase() === String(username).toLowerCase()) {
                        state.authorsCache[username] = state.currentUser;
                    } else {
                        callServer('serverGetProfile', [username], function(res) {
                            if (res.success && res.data) {
                                state.authorsCache[username] = res.data;
                                if (state.currentView === 'author' && state.selectedAuthor && state.selectedAuthor.username === username) {
                                    state.selectedAuthor = res.data;
                                    render();
                                }
                            }
                        }, null, true);
                    }
                }
            });
        }

        function openAuthorView(bookId) {
            const book = state.allBooks.find(b => String(b.id) === String(bookId)) || state.books.find(b => String(b.id) === String(bookId));
            if (!book) {
                showToast("Data buku tidak ditemukan", 'error');
                return;
            }

            state.selectedAuthorBook = book;
            const authorUsername = book.uploadedBy || 'admin';

            // ==============================================================
            // KIRIM NOTIFIKASI SLUG KE WEBSITE UTAMA: /karyaku/:username
            // ==============================================================
            notifyParentKaryaku({
                type: 'KARYAKU_NAVIGATE',
                view: 'author',
                username: authorUsername
            });

            if (state.currentUser && String(state.currentUser.username).toLowerCase() === String(authorUsername).toLowerCase()) {
                state.authorsCache[authorUsername] = {
                    id: state.currentUser.id,
                    username: state.currentUser.username,
                    name: state.currentUser.name,
                    role: state.currentUser.role,
                    email: state.currentUser.email,
                    status: state.currentUser.status,
                    whatsapp: state.currentUser.whatsapp || '',
                    address: state.currentUser.address || '',
                    bio: state.currentUser.bio || '',
                    avatar: state.currentUser.avatar || ''
                };
            }

            if (state.authorsCache[authorUsername]) {
                state.selectedAuthor = state.authorsCache[authorUsername];
                state.currentView = 'author';
                render();
                return;
            }

            state.selectedAuthor = {
                name: book.author || 'Penulis Buku',
                username: authorUsername,
                email: '-',
                whatsapp: '-',
                address: '-',
                bio: '-'
            };
            state.currentView = 'author';
            render();

            callServer('serverGetProfile', [authorUsername], function(res) {
                if (res.success && res.data) {
                    state.authorsCache[authorUsername] = res.data;
                    state.selectedAuthor = res.data;
                    if (state.currentView === 'author') {
                        render();
                    }
                }
            }, function() {}, true);
        }

        function openAuthorBooksView() {
            state.currentView = 'author_books';
            render();
        }

        function fetchBooks() {
            callServer('serverGetBooks', ['Semua', ''], function(res) {
                if (res.success) {
                    state.allBooks = res.data || [];
                    applyLocalFilter();
                    prefetchAuthorProfiles();

                    // Buka otomatis buku / penulis jika ada antrean navigasi saat loading
                    if (state.pendingNav) {
                        processKaryakuNav(state.pendingNav);
                    }

                    // Beritahu website utama bahwa data buku siap
                    notifyParentKaryaku({ type: 'KARYAKU_READY' });
                }
            });
        }

        function applyLocalFilter() {
            let filtered = state.allBooks;

            if (state.selectedCategory && state.selectedCategory !== 'Semua') {
                filtered = filtered.filter(b => b.category === state.selectedCategory);
            }

            if (state.searchQuery && state.searchQuery.trim() !== '') {
                const q = state.searchQuery.toLowerCase().trim();
                filtered = filtered.filter(b => 
                    (b.title && b.title.toLowerCase().includes(q)) || 
                    (b.author && b.author.toLowerCase().includes(q)) ||
                    (b.category && b.category.toLowerCase().includes(q)) ||
                    (b.description && b.description.toLowerCase().includes(q))
                );
            }

            state.books = filtered;

            const gridContainer = document.getElementById('books-grid-container');
            const countDisplay = document.getElementById('books-count-display');
            const categoryContainer = document.getElementById('category-pills-container');
            const popularContainer = document.getElementById('popular-books-container');

            if (gridContainer && state.currentView === 'catalog') {
                if (popularContainer) {
                    popularContainer.innerHTML = renderPopularBooks();
                }

                if (countDisplay) {
                    countDisplay.innerHTML = `Menampilkan <span class="font-bold text-slate-800">${state.books.length}</span> buku`;
                }
                
                if (categoryContainer) {
                    categoryContainer.innerHTML = CATEGORIES.map(cat => `
                        <button onclick="selectCategory('${cat}')" 
                            class="px-3.5 sm:px-4 py-1.5 sm:py-2 rounded-xl text-xs font-semibold transition whitespace-nowrap ${state.selectedCategory === cat ? 'bg-brand-600 text-white shadow-md shadow-brand-600/20' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}">
                            ${cat}
                        </button>
                    `).join('');
                }

                if (state.books.length === 0) {
                    gridContainer.innerHTML = renderEmptyState();
                } else {
                    gridContainer.innerHTML = `
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4 sm:gap-6">
                            ${state.books.map(book => renderBookCard(book)).join('')}
                        </div>
                    `;
                }
            } else {
                render();
            }
        }

        function selectCategory(cat) {
            state.selectedCategory = cat;
            applyLocalFilter();
        }

        function handleSearch(val) {
            state.searchQuery = val;
            applyLocalFilter();
        }

        function resetFilters() {
            state.selectedCategory = 'Semua';
            state.searchQuery = '';
            applyLocalFilter();
        }

        function openProfileView() {
            if (!state.currentUser) {
                showToast("Silakan login terlebih dahulu untuk mengedit profil", "error");
                switchView('auth');
                return;
            }

            switchView('profile');
        }

        function handleSaveProfile(e) {
            e.preventDefault();
            if (!state.currentUser) return;

            const profileData = {
                name: document.getElementById('prof-name').value.trim(),
                email: document.getElementById('prof-email').value.trim(),
                whatsapp: document.getElementById('prof-wa').value.trim(),
                avatar: document.getElementById('prof-avatar').value.trim(),
                address: document.getElementById('prof-address').value.trim(),
                bio: document.getElementById('prof-bio').value.trim()
            };

            showLoading(true, 'Menyimpan Perubahan Profil...');
            callServer('serverUpdateProfile', [state.currentUser.username, profileData], function(res) {
                showLoading(false);
                if (res.success) {
                    state.currentUser.name = profileData.name;
                    state.currentUser.email = profileData.email;
                    state.currentUser.whatsapp = profileData.whatsapp;
                    state.currentUser.avatar = profileData.avatar;
                    state.currentUser.address = profileData.address;
                    state.currentUser.bio = profileData.bio;

                    if (state.authorsCache[state.currentUser.username]) {
                        state.authorsCache[state.currentUser.username] = {
                            ...state.authorsCache[state.currentUser.username],
                            ...profileData
                        };
                    }

                    showToast(res.message || "Profil berhasil diperbarui!");
                    render();
                } else {
                    showToast(res.message || "Gagal menyimpan profil", "error");
                }
            }, function() {
                showLoading(false);
            });
        }

        function handleSavePassword(e) {
            e.preventDefault();
            if (!state.currentUser) return;

            const oldPass = document.getElementById('prof-old-pass').value;
            const newPass = document.getElementById('prof-new-pass').value;
            const confirmPass = document.getElementById('prof-confirm-pass').value;

            if (newPass !== confirmPass) {
                showToast("Password baru dan konfirmasi password tidak cocok", "error");
                return;
            }

            if (newPass.length < 4) {
                showToast("Password baru minimal 4 karakter", "error");
                return;
            }

            showLoading(true, 'Memperbarui Password...');
            callServer('serverUpdatePassword', [state.currentUser.username, oldPass, newPass], function(res) {
                showLoading(false);
                if (res.success) {
                    showToast(res.message || "Password berhasil diubah!");
                    document.getElementById('prof-old-pass').value = '';
                    document.getElementById('prof-new-pass').value = '';
                    document.getElementById('prof-confirm-pass').value = '';
                } else {
                    showToast(res.message || "Gagal mengubah password", "error");
                }
            }, function() {
                showLoading(false);
            });
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('input-username').value.trim();
            const p = document.getElementById('input-password').value.trim();

            showLoading(true, 'Sedang Memproses Login...');
            callServer('serverLogin', [u, p], function(res) {
                showLoading(false);
                if (res.success) {
                    state.currentUser = res.data;
                    state.currentView = 'catalog';
                    fetchBooks();
                    fetchUserBookmarks();
                    showToast(`Selamat datang kembali, ${res.data.name}!`);
                } else {
                    showToast(res.message, 'error');
                }
            }, function() {
                showLoading(false);
            });
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value.trim();

            showLoading(true, 'Mendaftarkan Akun Baru...');
            callServer('serverRegister', [name, username, email, password], function(res) {
                showLoading(false);
                if (res.success) {
                    showToast(res.message || "Pendaftaran akun berhasil!");
                    state.authTab = 'login';
                    render();
                } else {
                    showToast(res.message, 'error');
                }
            }, function() {
                showLoading(false);
            });
        }

        function handleUploadSubmit(e) {
            e.preventDefault();
            const username = state.currentUser ? state.currentUser.username : 'Guest';

            const bookData = {
                title: document.getElementById('up-title').value,
                author: document.getElementById('up-author').value,
                category: document.getElementById('up-category').value,
                year: document.getElementById('up-year').value,
                coverUrl: document.getElementById('up-cover').value,
                description: document.getElementById('up-desc').value,
                driveFileId: document.getElementById('up-drive').value,
                totalPages: document.getElementById('up-pages').value
            };

            showLoading(true);
            callServer('serverUploadBook', [bookData, username], function(res) {
                showLoading(false);
                if(res.success) {
                    showToast(res.message);
                    fetchBooks();
                    
                    triggerPopup('SAVE_BOOK', function() {
                        switchView('catalog');
                    });
                } else {
                    showToast(res.message, 'error');
                }
            }, function(err) {
                showLoading(false);
            });
        }

        function fetchPopups() {
            callServer('serverGetPopups', [], function(res) {
                if (res.success && res.data) {
                    state.popups = res.data;
                    if (!state.hasShownHomePopup && state.currentView === 'catalog') {
                        triggerPopup('HOME');
                        state.hasShownHomePopup = true;
                    }
                }
            });
        }

        function triggerPopup(type, onClosedCallback) {
            const popup = state.popups.find(p => p.type === type && p.isActive);
            if (!popup) {
                if (onClosedCallback) onClosedCallback();
                return;
            }

            const modal = document.getElementById('popup-modal');
            const card = document.getElementById('popup-card');
            const img = document.getElementById('popup-image');
            const titleBar = document.getElementById('popup-title-bar');
            const titleText = document.getElementById('popup-title-text');

            if (!modal || !img) {
                if (onClosedCallback) onClosedCallback();
                return;
            }

            let displayUrl = popup.displayUrl || popup.imageUrl;
            
            if (popup.driveId) {
                img.onerror = function() {
                    if (!this.dataset.retried) {
                        this.dataset.retried = '1';
                        this.src = 'https://drive.google.com/thumbnail?id=' + popup.driveId + '&sz=w1000';
                    }
                };
            }
            
            img.src = displayUrl;

            if (popup.title && popup.title.trim() !== '') {
                titleText.textContent = popup.title;
                titleBar.classList.remove('hidden');
            } else {
                titleBar.classList.add('hidden');
            }

            window.popupOnClosed = onClosedCallback;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
        }

        function closePopupModal() {
            const modal = document.getElementById('popup-modal');
            const card = document.getElementById('popup-card');

            if (modal && card) {
                card.classList.remove('scale-100');
                card.classList.add('scale-95');
                modal.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(restorePopupCardHtml, 300);
            }

            if (window.popupOnClosed) {
                const cb = window.popupOnClosed;
                window.popupOnClosed = null;
                cb();
            }
        }

        function handleLogout() {
            state.currentUser = null;
            state.bookmarks = [];
            showToast('Anda telah berhasil keluar');
            render();
        }

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input && icon) {
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'fas fa-eye-slash';
                } else {
                    input.type = 'password';
                    icon.className = 'fas fa-eye';
                }
            }
        }

        function fetchUserBookmarks() {
            if (!state.currentUser) return;
            callServer('serverGetBookmarks', [state.currentUser.username], function(res) {
                if (res.success) {
                    state.bookmarks = res.data;
                    if(state.currentView === 'catalog') render();
                }
            });
        }

        function toggleBookmark(bookId, e) {
            if (e) e.stopPropagation();
            if (!state.currentUser) {
                showToast("Silakan login untuk menyimpan bookmark", "error");
                switchView('auth');
                return;
            }

            callServer('serverToggleBookmark', [state.currentUser.username, bookId], function(res) {
                if (res.success) {
                    if (res.bookmarked) {
                        if (!state.bookmarks.includes(bookId)) state.bookmarks.push(bookId);
                    } else {
                        state.bookmarks = state.bookmarks.filter(id => id !== bookId);
                    }
                    if(state.currentView === 'catalog' || state.currentView === 'reader') render();
                    showToast(res.message);
                }
            });
        }

        function previewImage(imageUrl, title, rawUrl) {
            const modal = document.getElementById('popup-modal');
            const card = document.getElementById('popup-card');
            const img = document.getElementById('popup-image');
            const titleBar = document.getElementById('popup-title-bar');
            const titleText = document.getElementById('popup-title-text');

            if (!modal || !img) return;

            let driveId = '';
            if (rawUrl) {
                const match = String(rawUrl).match(/\/d\/([a-zA-Z0-9_-]+)/) || String(rawUrl).match(/id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) driveId = match[1];
            }

            img.dataset.retried = '';
            if (driveId) {
                img.onerror = function() {
                    if (!this.dataset.retried) {
                        this.dataset.retried = '1';
                        this.src = 'https://drive.google.com/thumbnail?id=' + driveId + '&sz=w1000';
                    }
                };
            } else {
                img.onerror = null;
            }

            img.src = imageUrl;

            if (title) {
                titleText.textContent = title;
                titleBar.classList.remove('hidden');
            } else {
                titleBar.classList.add('hidden');
            }

            window.popupOnClosed = null;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
        }

        function showLoading(show, message = 'Memproses...') {
            state.isLoading = show;
            const modal = document.getElementById('loading-modal');
            const modalText = document.getElementById('loading-modal-text');
            const card = document.getElementById('loading-modal-card');

            if (modal) {
                if (show) {
                    if (modalText) modalText.textContent = message;
                    modal.classList.remove('opacity-0', 'pointer-events-none');
                    if (card) {
                        card.classList.remove('scale-95');
                        card.classList.add('scale-100');
                    }
                } else {
                    modal.classList.add('opacity-0', 'pointer-events-none');
                    if (card) {
                        card.classList.remove('scale-100');
                        card.classList.add('scale-95');
                    }
                }
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const msg = document.getElementById('toast-message');

            if (msg) msg.textContent = message;
            if (icon) {
                if (type === 'error') {
                    icon.className = 'fas fa-exclamation-circle text-rose-400 text-lg';
                } else {
                    icon.className = 'fas fa-check-circle text-emerald-400 text-lg';
                }
            }

            if (toast) {
                toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
                }, 3000);
            }
        }

        function fetchBannerImages() {
            callServer('serverGetBannerImages', [], function(res) {
                if (res.success && res.data && res.data.length > 0) {
                    state.bannerImages = res.data;
                    initBannerSlideshow();
                }
            });
        }

        function initBannerSlideshow() {
            if (state.bannerTimer) clearInterval(state.bannerTimer);
            if (!state.bannerImages || state.bannerImages.length === 0) return;

            const updateBg = () => {
                const bgEl = document.getElementById('hero-slideshow-bg');
                if (bgEl) {
                    bgEl.style.backgroundImage = `url('${state.bannerImages[state.currentBannerIndex]}')`;
                }
            };

            updateBg();

            if (state.bannerImages.length > 1) {
                state.bannerTimer = setInterval(() => {
                    state.currentBannerIndex = (state.currentBannerIndex + 1) % state.bannerImages.length;
                    updateBg();
                }, 4000);
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            render();
            checkUrlParametersOnLoad();
            if (state.allBooks && state.allBooks.length > 0) {
                applyLocalFilter();
                prefetchAuthorProfiles();
                if (state.pendingNav) {
                    processKaryakuNav(state.pendingNav);
                }
            } else {
                fetchBooks();
            }
            fetchPopups();
            fetchBannerImages();
            
            // Mengirim sinyal handshake ke website utama bahwa e-reader siap
            notifyParentKaryaku({ type: 'KARYAKU_READY' });
        });
    </script>
</body>
</html>
